hat moves."</tspan></text><text x="30" y="274" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="15" fill="#59616b" text-anchor="end" opacity=".8">10</text><text x="52" y="274" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="16" fill="#c9d1d9" xml:space="preserve"><tspan fill="#ff9f43">&gt;&gt;&gt; </tspan></text><rect x="90.4" y="259" width="9" height="19" fill="#ff9f43" filter="url(#glow)"><animate attributeName="opacity" dur="1s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;.5;1" values="1;0;1"/></rect>
