<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 848 372" width="848" height="372" role="img" aria-label="Animated pick and place gantry robot moving boxes">
<defs><filter id="ds" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity=".55"/></filter>
<filter id="ds2" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity=".6"/></filter>
<filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="2.4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<pattern id="brush" width="8" height="3" patternUnits="userSpaceOnUse"><rect width="8" height="1" fill="#fff" opacity=".055"/><rect y="1.6" width="5" height="1" fill="#000" opacity=".06"/></pattern>
<pattern id="scan" width="4" height="3" patternUnits="userSpaceOnUse"><rect width="4" height="1" fill="#000" opacity=".3"/></pattern><clipPath id="fr-screen"><rect width="800" height="300" rx="12"/></clipPath></defs>
<rect x="4" y="4" width="840" height="364" rx="22" fill="#4a505a" filter="url(#ds)"/><rect x="4" y="4" width="840" height="364" rx="22" fill="url(#brush)"/><path d="M5,346 V26 A21,21 0 0 1 26,5 H822" fill="none" stroke="#7b838f" stroke-width="1.6" stroke-linecap="round"/><path d="M822,5 A21,21 0 0 1 843,26 V346 A21,21 0 0 1 822,367 H26 A21,21 0 0 1 5,346" fill="none" stroke="#15171b" stroke-width="1.6" stroke-linecap="round"/>
<rect x="19" y="19" width="810" height="310" rx="15" fill="#0b0d10"/>
<path d="M19,314 V34 A15,15 0 0 1 34,19 H814" fill="none" stroke="#14161a" stroke-width="1.8" stroke-linecap="round"/><path d="M814,19 A15,15 0 0 1 829,34 V314 A15,15 0 0 1 814,329 H34 A15,15 0 0 1 19,314" fill="none" stroke="#7b838f" stroke-width="1.8" stroke-linecap="round"/>
<g transform="translate(24 24)"><g clip-path="url(#fr-screen)">
<defs>
  
  
  
  
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#ff9f43" stroke-opacity=".07"/></pattern>
  <style>.mono{font-family:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace}</style>
</defs>
<rect width="800" height="300" rx="14" fill="#14181d"/>
<rect width="800" height="300" rx="14" fill="url(#grid)"/>
<rect x=".75" y=".75" width="798.5" height="298.5" rx="13.5" fill="none" stroke="#ff9f43" stroke-opacity=".35"/>

<text x="24" y="28" class="mono" font-size="12" fill="#ff9f43" letter-spacing="2">PICK &amp; PLACE // CARTESIAN GANTRY</text>
<circle cx="770" cy="23" r="4" fill="#3fb950" filter="url(#glow)"><animate attributeName="opacity" values="1;.2;1" dur="1.2s" repeatCount="indefinite"/></circle>
<text x="756" y="27" text-anchor="end" class="mono" font-size="11" fill="#8b93a0">ONLINE</text>

<!-- frame -->
<rect x="34" y="48" width="12" height="200" fill="#8b95a3"/>
<rect x="754" y="48" width="12" height="200" fill="#8b95a3"/>
<rect x="30" y="44" width="740" height="14" rx="4" fill="#8b95a3"/>
<rect x="30" y="52" width="740" height="3" fill="#0e1114" opacity=".5"/>

<!-- floor -->
<rect x="0" y="242" width="800" height="58" fill="#0b0e11"/>
<rect x="0" y="242" width="800" height="3" fill="#ff9f43" opacity=".4"/>

<!-- conveyor (pickup) -->
<rect x="60" y="228" width="180" height="14" rx="3" fill="#262b32" stroke="#3d444e"/>
<line x1="64" y1="235" x2="236" y2="235" stroke="#ff9f43" stroke-width="2" stroke-dasharray="8 10" opacity=".8">
  <animate attributeName="stroke-dashoffset" values="0;-18" dur=".6s" repeatCount="indefinite"/></line>
<rect x="75" y="242" width="8" height="18" fill="#3d444e"/><rect x="217" y="242" width="8" height="18" fill="#3d444e"/>
<!-- pickup marker -->
<path d="M120 252h60" stroke="#39d0ff" stroke-width="2" stroke-dasharray="4 4" opacity=".7"><animate attributeName="opacity" values=".2;.9;.2" dur="1.6s" repeatCount="indefinite"/></path>
<text x="150" y="272" text-anchor="middle" class="mono" font-size="10" fill="#39d0ff" opacity=".8">PICK</text>

<!-- tray (place) -->
<path d="M570 200V242H730V200" fill="none" stroke="#3d444e" stroke-width="5" stroke-linejoin="round"/>
<rect x="572" y="228" width="156" height="14" fill="#262b32"/>
<g opacity=".9">
  <g transform="translate(603 0)"><g transform="translate(0 0)" opacity="1">
    <rect x="-18" y="192" width="36" height="36" rx="3" fill="#c98d4b" stroke="#6b4420" stroke-width="1.5"/>
    <rect x="-18" y="205" width="36" height="6" fill="#e8c79a" opacity=".55"/>
    <rect x="-3" y="192" width="6" height="36" fill="#6b4420" opacity=".25"/></g></g>
  <g transform="translate(697 0)"><g transform="translate(0 0)" opacity="1">
    <rect x="-18" y="192" width="36" height="36" rx="3" fill="#c98d4b" stroke="#6b4420" stroke-width="1.5"/>
    <rect x="-18" y="205" width="36" height="6" fill="#e8c79a" opacity=".55"/>
    <rect x="-3" y="192" width="6" height="36" fill="#6b4420" opacity=".25"/></g></g>
</g>
<text x="650" y="272" text-anchor="middle" class="mono" font-size="10" fill="#3fb950" opacity=".8">PLACE</text>

<!-- moving box -->
<g transform="translate(150 0)"><g>
  <animateTransform attributeName="transform" type="translate" dur="8s" repeatCount="indefinite" keyTimes="0;0.18;0.28;0.5;0.58;1" values="0 0;0 0;0 -65;500 -65;500 0;500 0" calcMode="spline" keySplines=".45 0 .55 1;.45 0 .55 1;.45 0 .55 1;.45 0 .55 1;.45 0 .55 1"/>
  <g opacity="0"><animate attributeName="opacity" dur="8s" repeatCount="indefinite" keyTimes="0;0.04;0.88;0.95;1" values="0;1;1;0;0"/><g transform="translate(0 0)" opacity="1">
    <rect x="-18" y="192" width="36" height="36" rx="3" fill="#c98d4b" stroke="#6b4420" stroke-width="1.5"/>
    <rect x="-18" y="205" width="36" height="6" fill="#e8c79a" opacity=".55"/>
    <rect x="-3" y="192" width="6" height="36" fill="#6b4420" opacity=".25"/></g></g>
</g></g>

<!-- carriage + arm -->
<g transform="translate(150 0)"><g>
  <animateTransform attributeName="transform" type="translate" dur="8s" repeatCount="indefinite" keyTimes="0;0.1;0.18;0.28;0.5;0.58;0.66;0.76;0.94;1" values="0 0;0 0;0 0;0 0;500 0;500 0;500 0;500 0;0 0;0 0" calcMode="spline" keySplines=".45 0 .55 1;.45 0 .55 1;.45 0 .55 1;.45 0 .55 1;.45 0 .55 1;.45 0 .55 1;.45 0 .55 1;.45 0 .55 1;.45 0 .55 1"/>
  <rect x="-34" y="40" width="68" height="36" rx="6" fill="#e8761c" stroke="#0e1114"/>
  <circle cx="-20" cy="58" r="4" fill="#0e1114"/><circle cx="20" cy="58" r="4" fill="#0e1114"/>
  <circle cx="0" cy="58" r="5" fill="#3fb950" filter="url(#glow)"><animate attributeName="opacity" values="1;.3;1" dur="1s" repeatCount="indefinite"/></circle>
  <rect x="-6" y="76" width="12" height="100" fill="#8b95a3" stroke="#0e1114" stroke-width=".8"><animate attributeName="height" dur="8s" repeatCount="indefinite" keyTimes="0;0.1;0.18;0.28;0.5;0.58;0.66;0.76;0.94;1" values="35;100;100;35;35;100;100;35;35;35" calcMode="spline" keySplines=".45 0 .55 1;.45 0 .55 1;.45 0 .55 1;.45 0 .55 1;.45 0 .55 1;.45 0 .55 1;.45 0 .55 1;.45 0 .55 1;.45 0 .55 1"/></rect>
  <g>
    <animateTransform attributeName="transform" type="translate" dur="8s" repeatCount="indefinite" keyTimes="0;0.1;0.18;0.28;0.5;0.58;0.66;0.76;0.94;1" values="0 -65;0 0;0 0;0 -65;0 -65;0 0;0 0;0 -65;0 -65;0 -65" calcMode="spline" keySplines=".45 0 .55 1;.45 0 .55 1;.45 0 .55 1;.45 0 .55 1;.45 0 .55 1;.45 0 .55 1;.45 0 .55 1;.45 0 .55 1;.45 0 .55 1"/>
    <rect x="-28" y="174" width="56" height="16" rx="4" fill="#f08a24" stroke="#0e1114"/>
    <rect x="-8" y="168" width="16" height="8" fill="#4a5d73"/>
    <g><animateTransform attributeName="transform" type="translate" dur="8s" repeatCount="indefinite" keyTimes="0;0.12;0.16;0.6;0.64;1" values="-8 0;-8 0;0 0;0 0;-8 0;-8 0" calcMode="spline" keySplines=".45 0 .55 1;.45 0 .55 1;.45 0 .55 1;.45 0 .55 1;.45 0 .55 1"/><rect x="-24" y="190" width="6" height="32" rx="2" fill="#c9d6e4" stroke="#0e1114" stroke-width=".8"/></g>
    <g><animateTransform attributeName="transform" type="translate" dur="8s" repeatCount="indefinite" keyTimes="0;0.12;0.16;0.6;0.64;1" values="8 0;8 0;0 0;0 0;8 0;8 0" calcMode="spline" keySplines=".45 0 .55 1;.45 0 .55 1;.45 0 .55 1;.45 0 .55 1;.45 0 .55 1"/><rect x="18" y="190" width="6" height="32" rx="2" fill="#c9d6e4" stroke="#0e1114" stroke-width=".8"/></g>
  </g>
</g></g>

<text x="400" y="288" text-anchor="middle" class="mono" font-size="13" fill="#39d0ff" opacity="0" letter-spacing="3">&gt;&gt; PICKING PART<animate attributeName="opacity" dur="8s" repeatCount="indefinite" keyTimes="0;0.18" values="1;0" calcMode="discrete"/></text><text x="400" y="288" text-anchor="middle" class="mono" font-size="13" fill="#ffb454" opacity="0" letter-spacing="3">&gt;&gt; TRANSFERRING<animate attributeName="opacity" dur="8s" repeatCount="indefinite" keyTimes="0;0.18;0.5" values="0;1;0" calcMode="discrete"/></text><text x="400" y="288" text-anchor="middle" class="mono" font-size="13" fill="#3fb950" opacity="0" letter-spacing="3">&gt;&gt; PLACING PART<animate attributeName="opacity" dur="8s" repeatCount="indefinite" keyTimes="0;0.5;0.76" values="0;1;0" calcMode="discrete"/></text><text x="400" y="288" text-anchor="middle" class="mono" font-size="13" fill="#bc8cff" opacity="0" letter-spacing="3">&gt;&gt; RETURNING HOME<animate attributeName="opacity" dur="8s" repeatCount="indefinite" keyTimes="0;0.76" values="0;1" calcMode="discrete"/></text>

<polygon points="0,0 400,0 160,300 0,300" fill="#fff" fill-opacity=".035"/>
<rect width="800" height="300" fill="url(#scan)" opacity=".35"/></g></g>
<text x="26" text-anchor="start" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="2.2" y="362.5" fill="#8a929e">HK-G2  //  CARTESIAN GANTRY</text><text x="26" text-anchor="start" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="2.2" y="361" fill="#1d2025">HK-G2  //  CARTESIAN GANTRY</text>
<circle cx="816" cy="357" r="8" fill="#15171b" stroke="#6b727e" stroke-width="1"/><circle cx="816" cy="357" r="5.6" fill="#3ddc84" filter="url(#glow)"><animate attributeName="opacity" values="1;.25;1" dur="2.0s" begin="0.0s" repeatCount="indefinite"/></circle><circle cx="814.4" cy="355.2" r="1.3" fill="#fff" opacity="0.7"/><circle cx="792" cy="357" r="8" fill="#15171b" stroke="#6b727e" stroke-width="1"/><circle cx="792" cy="357" r="5.6" fill="#ffb020" filter="url(#glow)"><animate attributeName="opacity" values="1;.25;1" dur="0.9s" begin="0.3s" repeatCount="indefinite"/></circle><circle cx="790.4" cy="355.2" r="1.3" fill="#fff" opacity="0.7"/><circle cx="768" cy="357" r="8" fill="#15171b" stroke="#6b727e" stroke-width="1"/><circle cx="768" cy="357" r="5.6" fill="#5a1f1f"></circle><circle cx="766.4" cy="355.2" r="1.3" fill="#fff" opacity="0.25"/>
<g><circle cx="14" cy="14" r="5.5" fill="#8b929d" stroke="#15171b" stroke-width="1.2"/><circle cx="14" cy="14" r="3.9" fill="none" stroke="#d3d8df" stroke-opacity=".45"/><g transform="rotate(30 14 14)"><line x1="10.3" y1="14" x2="17.7" y2="14" stroke="#23262b" stroke-width="2"/><line x1="10.3" y1="15.4" x2="17.7" y2="15.4" stroke="#e0e4ea" stroke-opacity=".4"/></g></g><g><circle cx="834" cy="14" r="5.5" fill="#8b929d" stroke="#15171b" stroke-width="1.2"/><circle cx="834" cy="14" r="3.9" fill="none" stroke="#d3d8df" stroke-opacity=".45"/><g transform="rotate(70 834 14)"><line x1="830.3" y1="14" x2="837.7" y2="14" stroke="#23262b" stroke-width="2"/><line x1="830.3" y1="15.4" x2="837.7" y2="15.4" stroke="#e0e4ea" stroke-opacity=".4"/></g></g><g><circle cx="14" cy="358" r="5.5" fill="#8b929d" stroke="#15171b" stroke-width="1.2"/><circle cx="14" cy="358" r="3.9" fill="none" stroke="#d3d8df" stroke-opacity=".45"/><g transform="rotate(110 14 358)"><line x1="10.3" y1="358" x2="17.7" y2="358" stroke="#23262b" stroke-width="2"/><line x1="10.3" y1="359.4" x2="17.7" y2="359.4" stroke="#e0e4ea" stroke-opacity=".4"/></g></g><g><circle cx="834" cy="358" r="5.5" fill="#8b929d" stroke="#15171b" stroke-width="1.2"/><circle cx="834" cy="358" r="3.9" fill="none" stroke="#d3d8df" stroke-opacity=".45"/><g transform="rotate(15 834 358)"><line x1="830.3" y1="358" x2="837.7" y2="358" stroke="#23262b" stroke-width="2"/><line x1="830.3" y1="359.4" x2="837.7" y2="359.4" stroke="#e0e4ea" stroke-opacity=".4"/></g></g>
</svg>